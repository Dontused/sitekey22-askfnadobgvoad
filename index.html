<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sitekey</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f2f2f2;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .painel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .contador {
            color: #666;
            font-size: 14px;
        }

        .pcs {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pc {
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        .pc-cabecalho {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }

        .pc-nome {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 17px;
            flex-wrap: wrap;
        }

        .nome-pc-edicao {
            display: none;
            align-items: center;
            gap: 7px;
        }

        .nome-pc-edicao input {
            width: 190px;
            max-width: 100%;
            border: 1px solid #ccc;
            border-radius: 7px;
            padding: 8px 10px;
            font-size: 14px;
            outline: none;
        }

        .nome-pc-edicao input:focus {
            border-color: #1769e0;
        }

        .editar-nome,
        .salvar-nome,
        .cancelar-nome {
            padding: 7px 10px;
            font-size: 12px;
        }

        .editar-nome {
            background: #eee;
            color: #333;
        }

        .salvar-nome {
            background: #1769e0;
            color: white;
        }

        .cancelar-nome {
            background: #ddd;
            color: #333;
        }

        .excluir-pc {
            background: #d93636;
            color: white;
            padding: 7px 10px;
            font-size: 12px;
        }

        .excluir-pc:hover {
            background: #b92323;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .bolinha {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #888;
        }

        .online {
            background: #20b455;
        }

        .offline {
            background: #d33;
        }

        .pc-conteudo {
            padding: 16px;
        }

        .pc-acoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .atualizar {
            background: #1769e0;
            color: white;
        }

        .atualizar:hover:not(:disabled) {
            background: #0f55bb;
        }

        .arquivos {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .arquivo {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .informacoes {
            flex: 1;
            min-width: 0;
        }

        .nome {
            font-weight: bold;
            margin-bottom: 5px;
            overflow-wrap: anywhere;
        }

        .data {
            color: #777;
            font-size: 13px;
        }

        .acoes {
            display: flex;
            gap: 8px;
        }

        .baixar {
            background: #20a464;
            color: white;
        }

        .excluir {
            background: #d93636;
            color: white;
        }

        .mensagem {
            text-align: center;
            color: #777;
            padding: 18px;
        }

        .sem-pcs {
            text-align: center;
            color: #777;
            padding: 30px 10px;
        }

        .atualizacao-pendente {
            color: #1769e0;
            font-size: 13px;
            font-weight: bold;
            margin-left: 5px;
        }

        @media (max-width: 600px) {
            .pc-cabecalho {
                align-items: flex-start;
                flex-direction: column;
            }

            .arquivo {
                flex-direction: column;
                align-items: stretch;
            }

            .acoes {
                width: 100%;
            }

            .acoes button {
                flex: 1;
            }

            .topo {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sitekey</h1>

    <p class="subtitulo">
        Gerenciamento de arquivos dos computadores
    </p>

    <div class="painel">

        <div class="topo">
            <strong>Computadores</strong>
            <span id="contador" class="contador">
                Verificando...
            </span>
        </div>

        <div id="pcs" class="pcs">
            <div class="mensagem">
                Carregando computadores...
            </div>
        </div>

    </div>

</div>

<script>

    /*
        URL DO SEU RENDER
    */

    const SERVIDOR =
        "https://sitekey22-askfnadobgvoad.onrender.com";

    // Impede atualizações simultâneas e evita que a tela
    // seja reconstruída enquanto uma atualização anterior ainda está rodando.
    let atualizacaoEmAndamento = false;

    // ID do computador que está sendo editado.
    // Enquanto houver uma edição aberta, o refresh automático
    // não reconstrói o card e não interfere no campo de texto.
    let nomeEmEdicao = null;


    // =========================================================
    // ESCAPAR TEXTO PARA HTML
    // =========================================================

    function escaparHTML(texto) {

        return String(texto)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    // =========================================================
    // NOMES PERSONALIZADOS DOS COMPUTADORES
    // =========================================================

    const CHAVE_NOMES_PCS = "sitekey_nomes_pcs";

    function obterNomesPCs() {
        try {
            return JSON.parse(
                localStorage.getItem(CHAVE_NOMES_PCS) || "{}"
            );
        } catch (erro) {
            return {};
        }
    }

    function obterNomePC(pc) {
        const nomes = obterNomesPCs();

        // O ID do PC é usado como chave.
        // Assim, quando o mesmo PC voltar a ficar online,
        // o nome personalizado continua sendo o mesmo.
        return nomes[pc.id] || pc.nome || "Computador";
    }

    function salvarNomePC(pcId, novoNome) {
        novoNome = String(novoNome || "").trim();

        if (!novoNome) {
            alert("Digite um nome para o computador.");
            return;
        }

        const nomes = obterNomesPCs();
        nomes[pcId] = novoNome;

        localStorage.setItem(
            CHAVE_NOMES_PCS,
            JSON.stringify(nomes)
        );

        carregarComputadores();
    }

    function editarNomePC(pcId) {
        nomeEmEdicao = pcId;

        const display =
            document.getElementById("nome-display-" + pcId);

        const edicao =
            document.getElementById("nome-edicao-" + pcId);

        if (!display || !edicao) {
            return;
        }

        display.style.display = "none";
        edicao.style.display = "flex";

        const input =
            document.getElementById("nome-input-" + pcId);

        if (input) {
            input.focus();
            input.select();
        }
    }

    function cancelarEdicaoNome(pcId) {
        nomeEmEdicao = null;

        const display =
            document.getElementById("nome-display-" + pcId);

        const edicao =
            document.getElementById("nome-edicao-" + pcId);

        if (display) display.style.display = "flex";
        if (edicao) edicao.style.display = "none";
    }

    function confirmarNomePC(pcId) {
        const input =
            document.getElementById("nome-input-" + pcId);

        if (!input) {
            return;
        }

        salvarNomePC(pcId, input.value);

        // Só libera o refresh automático depois que o usuário
        // clicar em Salvar.
        nomeEmEdicao = null;
    }


    // =========================================================
    // CARREGAR COMPUTADORES
    // =========================================================

    async function carregarComputadores() {

        // Se já existe uma atualização em andamento, não inicia outra.
        if (atualizacaoEmAndamento) {
            return;
        }

        // Não reconstrói os cards enquanto o usuário estiver editando
        // o nome de um computador.
        if (nomeEmEdicao !== null) {
            return;
        }

        atualizacaoEmAndamento = true;

        const container =
            document.getElementById("pcs");

        const contador =
            document.getElementById("contador");

        try {

            const resposta =
                await fetch(SERVIDOR + "/pcs", {
                    cache: "no-store"
                });

            if (!resposta.ok) {
                throw new Error("Erro ao carregar PCs");
            }

            const dados =
                await resposta.json();

            const lista = dados.pcs || [];

            const online =
                lista.filter(pc => pc.online).length;

            contador.textContent =
                `${lista.length} computador(es) • ${online} online`;

            /*
             * IMPORTANTE:
             * Não usamos innerHTML = "" aqui.
             *
             * Os novos cards são montados primeiro em um
             * DocumentFragment. Só depois que tudo estiver
             * pronto substituímos o conteúdo antigo de uma vez.
             *
             * Assim o usuário não vê a tela desaparecer.
             */
            const novaTela =
                document.createDocumentFragment();

            if (lista.length === 0) {

                const vazio =
                    document.createElement("div");

                vazio.className = "sem-pcs";

                vazio.textContent =
                    "Nenhum computador conectado ainda.";

                novaTela.appendChild(vazio);

            } else {

                for (const pc of lista) {
                    await criarCardPC(pc, novaTela);
                }

            }

            /*
             * Troca única e instantânea.
             * O conteúdo antigo permanece na tela durante
             * toda a consulta ao servidor.
             */
            container.replaceChildren(novaTela);

        } catch (erro) {

            console.error("Erro ao carregar computadores:", erro);

            contador.textContent =
                "Servidor indisponível";

            /*
             * NÃO apagamos os cards que já estavam na tela.
             * Assim, se o Render demorar ou falhar momentaneamente,
             * a interface não pisca nem fica vazia.
             */
        } finally {

            atualizacaoEmAndamento = false;
        }
    }


    // =========================================================
    // CRIAR CARD DE UM COMPUTADOR
    // =========================================================

    async function criarCardPC(pc, container) {

        const div =
            document.createElement("div");

        div.className = "pc";

        const idSeguro =
            encodeURIComponent(pc.id);


        const statusClasse =
            pc.online ? "online" : "offline";

        const statusTexto =
            pc.online ? "ONLINE" : "OFFLINE";


        let arquivos = [];

        try {

            const resposta =
                await fetch(
                    SERVIDOR +
                    "/arquivos?pc_id=" +
                    idSeguro
                );

            if (resposta.ok) {

                const dados =
                    await resposta.json();

                arquivos =
                    dados.arquivos || [];
            }

        } catch (erro) {

            arquivos = [];
        }


        const arquivosHTML =
            arquivos.length === 0
                ? `
                    <div class="mensagem">
                        Nenhum arquivo recebido deste computador.
                    </div>
                  `
                : arquivos.map(arquivo => {

                    const nome =
                        escaparHTML(arquivo.nome);

                    const idArquivo =
                        encodeURIComponent(arquivo.id);

                    return `
                        <div class="arquivo">

                            <div class="informacoes">

                                <div class="nome">
                                    📄 ${nome}
                                </div>

                                <div class="data">
                                    Enviado em
                                    ${escaparHTML(arquivo.data)}
                                    às
                                    ${escaparHTML(arquivo.hora)}
                                </div>

                            </div>

                            <div class="acoes">

                                <button
                                    class="baixar"
                                    onclick="baixarArquivo(
                                        '${idSeguro}',
                                        '${idArquivo}'
                                    )">
                                    Baixar
                                </button>

                                <button
                                    class="excluir"
                                    onclick="excluirArquivo(
                                        '${idSeguro}',
                                        '${idArquivo}'
                                    )">
                                    Excluir
                                </button>

                            </div>

                        </div>
                    `;
                }).join("");


        const pedido =
            pc.atualizacao_solicitada
                ? `
                    <span class="atualizacao-pendente">
                        • Atualização solicitada
                    </span>
                  `
                : "";


        div.innerHTML = `

            <div class="pc-cabecalho">

                <div class="pc-nome">

                    <span
                        id="nome-display-${idSeguro}"
                        style="display:flex; align-items:center; gap:10px;">

                        💻
                        <span>
                            ${escaparHTML(obterNomePC(pc))}
                        </span>

                        <button
                            class="editar-nome"
                            onclick="editarNomePC('${idSeguro}')">
                            ✏️ Editar
                        </button>

                        <button
                            class="excluir-pc"
                            onclick="excluirPC(
                                '${idSeguro}',
                                '${escaparHTML(obterNomePC(pc))}'
                            )">
                            🗑️ Remover
                        </button>

                    </span>

                    <span
                        id="nome-edicao-${idSeguro}"
                        class="nome-pc-edicao">

                        <input
                            id="nome-input-${idSeguro}"
                            type="text"
                            maxlength="50"
                            value="${escaparHTML(obterNomePC(pc))}"
                            onkeydown="if(event.key === 'Enter') confirmarNomePC('${idSeguro}'); if(event.key === 'Escape') cancelarEdicaoNome('${idSeguro}');">

                        <button
                            class="salvar-nome"
                            onclick="confirmarNomePC('${idSeguro}')">
                            Salvar
                        </button>

                        <button
                            class="cancelar-nome"
                            onclick="cancelarEdicaoNome('${idSeguro}')">
                            Cancelar
                        </button>

                    </span>

                    ${pedido}

                </div>

                <div class="status">

                    <div class="bolinha ${statusClasse}">
                    </div>

                    <span>
                        ${statusTexto}
                    </span>

                </div>

            </div>


            <div class="pc-conteudo">

                <div class="pc-acoes">

                    <button
                        class="atualizar"
                        onclick="solicitarAtualizacao(
                            '${idSeguro}',
                            '${escaparHTML(pc.nome)}'
                        )"
                        ${pc.online ? "" : "disabled"}>

                        🔄 Atualizar arquivo

                    </button>

                </div>


                <div class="arquivos">

                    ${arquivosHTML}

                </div>

            </div>

        `;

        container.appendChild(div);
    }


    // =========================================================
    // SOLICITAR ATUALIZAÇÃO DE UM PC
    // =========================================================

    async function solicitarAtualizacao(
        pcId,
        pcNome
    ) {

        try {

            const resposta =
                await fetch(
                    SERVIDOR +
                    "/atualizar?pc_id=" +
                    pcId,
                    {
                        method: "POST"
                    }
                );

            const dados =
                await resposta.json();


            if (dados.sucesso) {

                // Não exibe mensagem na página.
                // Apenas atualiza o estado do computador silenciosamente.
                carregarComputadores();

            } else {

                alert(
                    dados.erro ||
                    "Não foi possível solicitar a atualização."
                );
            }


        } catch (erro) {

            alert(
                "Não foi possível conectar ao servidor."
            );
        }
    }


    // =========================================================
    // REMOVER DISPOSITIVO
    // =========================================================

    async function excluirPC(pcId, pcNome) {

        const confirmar =
            confirm(
                "Deseja realmente remover este dispositivo?\n\n" +
                "Computador: " + pcNome + "\n\n" +
                "Os arquivos armazenados deste PC também serão excluídos."
            );

        if (!confirmar) {
            return;
        }

        try {

            const resposta =
                await fetch(
                    SERVIDOR +
                    "/excluir_pc/" +
                    encodeURIComponent(pcId),
                    {
                        method: "DELETE"
                    }
                );

            const dados =
                await resposta.json();

            if (dados.sucesso) {

                // Remove o nome personalizado salvo neste navegador.
                const nomes = obterNomesPCs();
                delete nomes[pcId];

                localStorage.setItem(
                    CHAVE_NOMES_PCS,
                    JSON.stringify(nomes)
                );

                carregarComputadores();

            } else {

                alert(
                    dados.erro ||
                    "Não foi possível remover o dispositivo."
                );
            }

        } catch (erro) {

            alert(
                "Não foi possível conectar ao servidor."
            );
        }
    }


    // =========================================================
    // BAIXAR
    // =========================================================

    function baixarArquivo(
        pcId,
        nome
    ) {

        window.location.href =
            SERVIDOR +
            "/baixar/" +
            pcId +
            "/" +
            nome;
    }


    // =========================================================
    // EXCLUIR
    // =========================================================

    async function excluirArquivo(
        pcId,
        nome
    ) {

        const confirmar =
            confirm(
                "Deseja realmente excluir este arquivo?"
            );


        if (!confirmar) {
            return;
        }


        try {

            const resposta =
                await fetch(
                    SERVIDOR +
                    "/excluir/" +
                    pcId +
                    "/" +
                    nome,
                    {
                        method: "DELETE"
                    }
                );


            const dados =
                await resposta.json();


            if (dados.sucesso) {

                carregarComputadores();

            } else {

                alert(
                    dados.erro ||
                    "Não foi possível excluir."
                );
            }


        } catch (erro) {

            alert(
                "Não foi possível conectar ao servidor."
            );
        }
    }


    // =========================================================
    // INICIALIZAÇÃO
    // =========================================================

    carregarComputadores();


    // Atualiza computadores, status e arquivos a cada 5 segundos.
    setInterval(() => {

        // A função já possui proteção contra chamadas simultâneas.
        carregarComputadores();

    }, 5000);

</script>

</body>
</html>
