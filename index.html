<body>

<div class="container">

    <h1>Sitekey</h1>

    <p class="subtitulo">
        Gerenciamento de arquivos dos computadores
    </p>

    <div class="painel">

        <div class="topo">

            <strong>
                Computadores
            </strong>

            <span
                id="contador"
                class="contador">
                Verificando...
            </span>

        </div>

        <div
            id="pcs"
            class="pcs">

            <div class="mensagem">
                Carregando computadores...
            </div>

        </div>

    </div>

</div>


<script>


    // =========================================================
    // SERVIDOR
    // =========================================================

    const SERVIDOR =
        "https://sitekey22-askfnadobgvoad.onrender.com";


    // Impede várias atualizações ao mesmo tempo.
    let atualizacaoEmAndamento = false;


    // =========================================================
    // ESCAPAR TEXTO
    // =========================================================

    function escaparHTML(texto) {

        return String(texto)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    // =========================================================
    // NOMES PERSONALIZADOS
    // =========================================================

    const CHAVE_NOMES_PCS =
        "sitekey_nomes_pcs";


    function obterNomesPCs() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    CHAVE_NOMES_PCS
                ) || "{}"
            );

        } catch (erro) {

            return {};

        }

    }


    function obterNomePC(pc) {

        const nomes =
            obterNomesPCs();

        return (
            nomes[pc.id] ||
            pc.nome ||
            "Computador"
        );

    }


    function salvarNomePC(
        pcId,
        novoNome
    ) {

        novoNome =
            String(
                novoNome || ""
            ).trim();


        if (!novoNome) {

            alert(
                "Digite um nome para o computador."
            );

            return;

        }


        const nomes =
            obterNomesPCs();


        nomes[pcId] =
            novoNome;


        localStorage.setItem(
            CHAVE_NOMES_PCS,
            JSON.stringify(nomes)
        );


        carregarComputadores();

    }


    function editarNomePC(pcId) {

        const display =
            document.getElementById(
                "nome-display-" + pcId
            );


        const edicao =
            document.getElementById(
                "nome-edicao-" + pcId
            );


        if (!display || !edicao) {
            return;
        }


        display.style.display =
            "none";


        edicao.style.display =
            "flex";


        const input =
            document.getElementById(
                "nome-input-" + pcId
            );


        if (input) {

            input.focus();
            input.select();

        }

    }


    function cancelarEdicaoNome(pcId) {

        const display =
            document.getElementById(
                "nome-display-" + pcId
            );


        const edicao =
            document.getElementById(
                "nome-edicao-" + pcId
            );


        if (display) {

            display.style.display =
                "flex";

        }


        if (edicao) {

            edicao.style.display =
                "none";

        }

    }


    function confirmarNomePC(pcId) {

        const input =
            document.getElementById(
                "nome-input-" + pcId
            );


        if (!input) {
            return;
        }


        salvarNomePC(
            pcId,
            input.value
        );

    }


    // =========================================================
    // CARREGAR COMPUTADORES
    // =========================================================

    async function carregarComputadores() {

        if (atualizacaoEmAndamento) {
            return;
        }


        atualizacaoEmAndamento = true;


        const container =
            document.getElementById(
                "pcs"
            );


        const contador =
            document.getElementById(
                "contador"
            );


        try {

            const resposta =
                await fetch(
                    SERVIDOR + "/pcs",
                    {
                        cache: "no-store"
                    }
                );


            if (!resposta.ok) {

                throw new Error(
                    "Erro ao carregar PCs"
                );

            }


            const dados =
                await resposta.json();


            const lista =
                dados.pcs || [];


            const online =
                lista.filter(
                    pc => pc.online
                ).length;


            contador.textContent =
                `${lista.length} computador(es) • ${online} online`;


            const novaTela =
                document.createDocumentFragment();


            if (lista.length === 0) {

                const vazio =
                    document.createElement(
                        "div"
                    );


                vazio.className =
                    "sem-pcs";


                vazio.textContent =
                    "Nenhum computador conectado ainda.";


                novaTela.appendChild(
                    vazio
                );

            } else {

                for (const pc of lista) {

                    await criarCardPC(
                        pc,
                        novaTela
                    );

                }

            }


            container.replaceChildren(
                novaTela
            );


        } catch (erro) {

            console.error(
                "Erro ao carregar computadores:",
                erro
            );


            contador.textContent =
                "Servidor indisponível";

        } finally {

            atualizacaoEmAndamento =
                false;

        }

    }


    // =========================================================
    // CRIAR CARD DO PC
    // =========================================================

    async function criarCardPC(
        pc,
        container
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "pc";


        const idSeguro =
            encodeURIComponent(
                pc.id
            );


        const statusClasse =
            pc.online
                ? "online"
                : "offline";


        const statusTexto =
            pc.online
                ? "ONLINE"
                : "OFFLINE";


        let arquivos = [];


        try {

            const resposta =
                await fetch(
                    SERVIDOR +
                    "/arquivos?pc_id=" +
                    idSeguro
                );


            if (resposta.ok) {

                const dados =
                    await resposta.json();


                arquivos =
                    dados.arquivos || [];

            }

        } catch (erro) {

            arquivos = [];

        }


        const arquivosHTML =

            arquivos.length === 0

                ? `

                    <div class="mensagem">
                        Nenhum arquivo recebido deste computador.
                    </div>

                  `

                : arquivos.map(
                    arquivo => {

                        const nome =
                            escaparHTML(
                                arquivo.nome
                            );


                        const idArquivo =
                            encodeURIComponent(
                                arquivo.id
                            );


                        return `

                            <div class="arquivo">

                                <div class="informacoes">

                                    <div class="nome">
                                        📄 ${nome}
                                    </div>

                                    <div class="data">

                                        Enviado em
                                        ${escaparHTML(
                                            arquivo.data
                                        )}

                                        às

                                        ${escaparHTML(
                                            arquivo.hora
                                        )}

                                    </div>

                                </div>


                                <div class="acoes">

                                    <button
                                        class="baixar"
                                        onclick="baixarArquivo(
                                            '${idSeguro}',
                                            '${idArquivo}'
                                        )">

                                        Baixar

                                    </button>


                                    <button
                                        class="excluir"
                                        onclick="excluirArquivo(
                                            '${idSeguro}',
                                            '${idArquivo}'
                                        )">

                                        Excluir

                                    </button>

                                </div>

                            </div>

                        `;

                    }
                ).join("");


        const pedido =

            pc.atualizacao_solicitada

                ? `

                    <span class="atualizacao-pendente">
                        • Atualização solicitada
                    </span>

                  `

                : "";


        const nomePC =
            obterNomePC(pc);


        div.innerHTML = `

            <div class="pc-cabecalho">


                <div class="pc-nome">


                    <span
                        id="nome-display-${idSeguro}"
                        style="
                            display:flex;
                            align-items:center;
                            gap:10px;
                        ">


                        💻


                        <span>
                            ${escaparHTML(nomePC)}
                        </span>


                        <button
                            class="editar-nome"
                            onclick="editarNomePC(
                                '${idSeguro}'
                            )">

                            ✏️ Editar

                        </button>


                    </span>


                    <span
                        id="nome-edicao-${idSeguro}"
                        class="nome-pc-edicao">


                        <input
                            id="nome-input-${idSeguro}"
                            type="text"
                            maxlength="50"
                            value="${escaparHTML(nomePC)}"
                            onkeydown="
                                if(event.key === 'Enter')
                                    confirmarNomePC('${idSeguro}');

                                if(event.key === 'Escape')
                                    cancelarEdicaoNome('${idSeguro}');
                            "
                        >


                        <button
                            class="salvar-nome"
                            onclick="
                                confirmarNomePC(
                                    '${idSeguro}'
                                )
                            ">

                            Salvar

                        </button>


                        <button
                            class="cancelar-nome"
                            onclick="
                                cancelarEdicaoNome(
                                    '${idSeguro}'
                                )
                            ">

                            Cancelar

                        </button>


                    </span>


                    ${pedido}


                </div>


                <div class="status">


                    <div
                        class="bolinha ${statusClasse}">
                    </div>


                    <span>
                        ${statusTexto}
                    </span>


                    <button
                        class="excluir-pc"
                        onclick="
                            excluirPC(
                                '${idSeguro}',
                                '${escaparHTML(nomePC)}'
                            )
                        ">

                        🗑️ Excluir PC

                    </button>


                </div>


            </div>


            <div class="pc-conteudo">


                <div class="pc-acoes">


                    <button
                        class="atualizar"
                        onclick="
                            solicitarAtualizacao(
                                '${idSeguro}',
                                '${escaparHTML(pc.nome)}'
                            )
                        "
                        ${pc.online ? "" : "disabled"}>

                        🔄 Atualizar arquivo

                    </button>


                </div>


                <div class="arquivos">

                    ${arquivosHTML}

                </div>


            </div>

        `;


        container.appendChild(
            div
        );

    }


    // =========================================================
    // SOLICITAR ATUALIZAÇÃO
    // =========================================================

    async function solicitarAtualizacao(
        pcId,
        pcNome
    ) {

        try {

            const resposta =
                await fetch(
                    SERVIDOR +
                    "/atualizar?pc_id=" +
                    pcId,
                    {
                        method: "POST"
                    }
                );


            const dados =
                await resposta.json();


            if (dados.sucesso) {

                // Atualiza silenciosamente.
                // Não mostra mensagem na página.

                carregarComputadores();

            } else {

                alert(
                    dados.erro ||
                    "Não foi possível solicitar a atualização."
                );

            }


        } catch (erro) {

            alert(
                "Não foi possível conectar ao servidor."
            );

        }

    }


    // =========================================================
    // EXCLUIR COMPUTADOR
    // =========================================================

    async function excluirPC(
        pcId,
        pcNome
    ) {

        const confirmar =
            confirm(
                "Deseja realmente excluir este computador?\n\n" +
                "Computador: " +
                pcNome +
                "\n\n" +
                "Os arquivos armazenados deste PC também serão excluídos."
            );


        if (!confirmar) {
            return;
        }


        try {

            const resposta =
                await fetch(
                    SERVIDOR +
                    "/excluir_pc/" +
                    pcId,
                    {
                        method: "DELETE"
                    }
                );


            const dados =
                await resposta.json();


            if (dados.sucesso) {

                // Atualiza silenciosamente.

                carregarComputadores();

            } else {

                alert(
                    dados.erro ||
                    "Não foi possível excluir o computador."
                );

            }


        } catch (erro) {

            alert(
                "Não foi possível conectar ao servidor."
            );

        }

    }


    // =========================================================
    // BAIXAR ARQUIVO
    // =========================================================

    function baixarArquivo(
        pcId,
        nome
    ) {

        window.location.href =
            SERVIDOR +
            "/baixar/" +
            pcId +
            "/" +
            nome;

    }


    // =========================================================
    // EXCLUIR ARQUIVO
    // =========================================================

    async function excluirArquivo(
        pcId,
        nome
    ) {

        const confirmar =
            confirm(
                "Deseja realmente excluir este arquivo?"
            );


        if (!confirmar) {
            return;
        }


        try {

            const resposta =
                await fetch(
                    SERVIDOR +
                    "/excluir/" +
                    pcId +
                    "/" +
                    nome,
                    {
                        method: "DELETE"
                    }
                );


            const dados =
                await resposta.json();


            if (dados.sucesso) {

                carregarComputadores();

            } else {

                alert(
                    dados.erro ||
                    "Não foi possível excluir."
                );

            }


        } catch (erro) {

            alert(
                "Não foi possível conectar ao servidor."
            );

        }

    }


    // =========================================================
    // INICIALIZAÇÃO
    // =========================================================

    carregarComputadores();


    // Atualiza a lista a cada 5 segundos.

    setInterval(
        () => {

            carregarComputadores();

        },
        5000
    );


</script>

</body>
</html>
